name: smart_notes
description: "A professional Smart Notes and Productivity application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  printing: ^5.13.2
  share_plus: ^10.1.0
  pdf: ^3.11.1
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2
  path_provider: ^2.1.2
  path: ^1.9.0

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
